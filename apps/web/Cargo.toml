[package]
name = "web"
version = "0.1.0"
edition = "2021"
publish = false

# Keep the WASM app as a separate workspace target so native workspace-wide
# commands do not try to build it for the host platform.
[workspace]

[features]
minimal-smoke = []
browser-test = ["app/browser-test"]
drive-smoke-test = []

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "4ce18741ad2ea007cb20a1dd96d2a170d224cc01" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "4ce18741ad2ea007cb20a1dd96d2a170d224cc01" }
app = { path = "../../crates/app", features = ["gpui-ui"] }
drive-web = { path = "../../crates/drive-web" }
formats = { path = "../../crates/formats" }
cache = { path = "../../crates/cache" }
search = { path = "../../crates/search" }
wasm-bindgen = "0.2"
js-sys = "0.3"
