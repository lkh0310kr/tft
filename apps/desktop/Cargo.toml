[package]
name = "desktop"
description = "TFT: a native Rust/GPUI knowledge base compatible with Obsidian vaults"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
# Windows VERSIONINFO; a no-op elsewhere.
build = "build.rs"

[[bin]]
name = "tft"
path = "src/main.rs"

[dependencies]
core.workspace = true
model.workspace = true
vault.workspace = true
markdown.workspace = true
highlight.workspace = true
cache.workspace = true
commands.workspace = true
cli.workspace = true
control.workspace = true
formats.workspace = true
search.workspace = true
suggest.workspace = true
text.workspace = true
canvas.workspace = true
pdf.workspace = true
math.workspace = true
mermaid.workspace = true
lyon.workspace = true
export.workspace = true
audio.workspace = true
paste.workspace = true
spell.workspace = true
# A stacked tab's title is drawn on its side, which gpui's text cannot do:
# its glyphs are outlined here and the bitmap turned.
ab_glyph.workspace = true
anyhow.workspace = true
async-channel.workspace = true
indexmap.workspace = true
serde.workspace = true
serde_json.workspace = true
rayon.workspace = true
notify.workspace = true
regex.workspace = true
serde_yaml.workspace = true
chrono.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
http_client.workspace = true
ureq.workspace = true
futures.workspace = true
# Already in the tree through gpui; a rendered PDF page is handed to gpui as
# one of its `image` frames.
image.workspace = true
raw-window-handle.workspace = true
smallvec.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
x11rb.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows.workspace = true

[build-dependencies]
embed-resource.workspace = true

[dev-dependencies]
tempfile.workspace = true
