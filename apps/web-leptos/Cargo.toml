[package]
name = "web"
version = "0.1.0"
edition = "2021"
publish = false

# Phase 0 is a local spike; keep it out of the desktop workspace so
# `cargo test --workspace` never builds a wasm-only crate for the host.
[workspace]

[dependencies]
app = { path = "../../crates/app" }
domain = { path = "../../crates/domain" }
drive-web = { path = "../../crates/drive-web" }
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["MouseEvent", "KeyboardEvent"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"
futures = "0.3"
