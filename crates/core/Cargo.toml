[package]
name = "core"
description = "Framework-neutral TFT logic: shared by the native app and the future web/WASM app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
[lib]
name = "tft_core"

[dependencies]
model.workspace = true
markdown.workspace = true
formats.workspace = true
cache.workspace = true
search.workspace = true
text.workspace = true
suggest.workspace = true
canvas.workspace = true
commands.workspace = true
highlight.workspace = true
paste.workspace = true
pdf = { workspace = true, optional = true }
math = { workspace = true, optional = true }
mermaid = { workspace = true, optional = true }

[features]
default = []
pdf = ["dep:pdf"]
math = ["dep:math"]
mermaid = ["dep:mermaid"]
