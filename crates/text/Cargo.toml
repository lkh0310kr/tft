[package]
name = "text"
description = "The editor's text model: buffer, line index, selections, undo and the edit plans of the editing commands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
[lib]
name = "tft_text"

[dependencies]
regex.workspace = true
# The table commands find the table under the cursor with the one Markdown
# parser rather than by looking for pipes.
markdown.workspace = true
# Deletion and caret motion step by grapheme cluster, so one Backspace
# takes an accented letter or a joined emoji whole.
unicode-segmentation = "1"
# Which way a line runs and which way each of its glyphs does, for
# right-to-left text: the crate the text system's own shaper (cosmic-text)
# reorders with, so the two agree. Pure Rust, MIT or Apache-2.0.
unicode-bidi = "0.3"
web-time.workspace = true

[dev-dependencies]
cache.workspace = true
serde.workspace = true
# The canvas round trip compares two canvases as JSON to tell a key-order
# rewrite from a changed value; `preserve_order` keeps `Value`'s own keys in
# file order, and `IndexMap`'s `PartialEq` is order-independent, which is
# exactly the comparison that question needs.
serde_json.workspace = true
formats.workspace = true
suggest.workspace = true
vault.workspace = true
tempfile.workspace = true
